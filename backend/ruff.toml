# Deployment target is Python 3.9 (see Dockerfile, CI). Without this, ruff
# infers a newer default and suggests 3.10+-only syntax (e.g. `X | None`
# instead of `Optional[X]`) that would break at runtime on 3.9.
target-version = "py39"

[lint]
ignore = [
    # Broad `except Exception` is used deliberately throughout this codebase as a
    # safety net around Selenium/browser automation, which can fail in many
    # unpredictable ways (stale elements, alerts, timeouts, driver crashes) that
    # aren't worth enumerating individually.
    "BLE001",
    # `Depends(...)` as an argument default is FastAPI's standard dependency-
    # injection pattern, not the general "mutable default argument" antipattern
    # this rule is meant to catch.
    "B008",
]
